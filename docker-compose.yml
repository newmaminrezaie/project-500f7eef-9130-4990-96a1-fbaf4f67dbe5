# docker-compose v1 compatible (Python docker-compose on the VPS).
# Dedicated Postgres for this app — kept isolated from Higooya's DB so backups,
# migration and debugging stay independent. Tuned for a low-RAM VPS.
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: rezaie_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_pg_password}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    # Low-memory tuning (~961MB VPS shared with Higooya)
    command: >
      postgres
      -c shared_buffers=64MB
      -c work_mem=2MB
      -c maintenance_work_mem=32MB
      -c effective_cache_size=192MB
      -c max_connections=20
      -c wal_buffers=2MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Bind to a different host port than Higooya's 5432 — loopback only.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: rezaie-app:latest
    container_name: rezaie_app
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      NODE_ENV: production
      PORT: "4000"
      HOST: "0.0.0.0"
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-changeme_pg_password}@postgres:5432/${POSTGRES_DB:-app}
      SESSION_SECRET: ${SESSION_SECRET}
      OWNER_USERNAME: ${OWNER_USERNAME:-owner}
      OWNER_PASSWORD: ${OWNER_PASSWORD}
      OWNER_NAME: ${OWNER_NAME:-مدیر}
      DAD_USERNAME: ${DAD_USERNAME:-dad}
      DAD_PASSWORD: ${DAD_PASSWORD}
      DAD_NAME: ${DAD_NAME:-پدر}
    ports:
      # Nginx on the host proxies rezaiesaffron.ir to 127.0.0.1:4000
      - "127.0.0.1:4000:4000"

volumes:
  pgdata:
