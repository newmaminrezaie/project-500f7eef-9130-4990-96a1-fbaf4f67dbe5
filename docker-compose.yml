# docker-compose v1 compatible (Python docker-compose on the VPS).
# Postgres is REUSED from the existing Higooya stack — we only run the app
# container here. The app talks to Higooya's postgres over the host loopback
# via network_mode: host, so no shared docker network is needed.
version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: rezaie-app:latest
    container_name: rezaie_app
    restart: unless-stopped
    # Host networking: app listens on 127.0.0.1:4000 directly, and can reach
    # Higooya's postgres on 127.0.0.1:5432 without exposing it publicly.
    network_mode: host
    environment:
      NODE_ENV: production
      PORT: "4000"
      HOST: "127.0.0.1"
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      OWNER_USERNAME: ${OWNER_USERNAME:-owner}
      OWNER_PASSWORD: ${OWNER_PASSWORD}
      OWNER_NAME: ${OWNER_NAME:-مدیر}
      DAD_USERNAME: ${DAD_USERNAME:-dad}
      DAD_PASSWORD: ${DAD_PASSWORD}
      DAD_NAME: ${DAD_NAME:-پدر}
